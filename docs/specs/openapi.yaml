      summary: Authenticated metadata read for a blob (any state; owner or operator/moderator).
      description: |
        Returns the blob row in ANY state (unlike the public read path, which
        rejects non-active states). Authorization: the blob's owner, or an
        operator/moderator. Mounted in M11 (M6-deferred).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Blob metadata.
          content:
            application/json:
              example:
                cid: bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
                mime_type: image/jpeg
                byte_size: 204815
                uploaded_at: '2026-07-29T11:04:22Z'
                state: active
                product: image
                owner_id: 9a1d4e6f-2b77-4c1a-8f0e-5d3b2a7c9e01
                urls:
                  bytes: https://nova.thebugreport.dev/blob/bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
                  json: https://nova.thebugreport.dev/blob/bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi.json
              schema: { $ref: '#/components/schemas/Blob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [metadata]
      operationId: updateBlobMeta
      summary: Update mutable owner-controlled fields on a blob.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              alt_text: Scanned page 14 of the 1987 service manual
              caption: Section 3.2, power supply rework.
            schema: { $ref: '#/components/schemas/BlobUpdate' }
      responses:
        '200':
          description: Blob metadata updated.
          content:
            application/json:
              example:
                cid: bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
                mime_type: image/jpeg
                byte_size: 204815
                uploaded_at: '2026-07-29T11:04:22Z'
                state: active
                product: image
                owner_id: 9a1d4e6f-2b77-4c1a-8f0e-5d3b2a7c9e01
                urls:
                  bytes: https://nova.thebugreport.dev/blob/bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
                  json: https://nova.thebugreport.dev/blob/bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi.json
              schema: { $ref: '#/components/schemas/Blob' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [metadata]
      operationId: deleteBlob
      summary: Soft-delete a blob (initiates crypto-shred and unpin broadcast).
      description: |
        The blob row enters `state = 'soft_deleted'` for the operator's
        configured grace window, then transitions to `tombstoned`. On
        tombstone the per-blob encryption key is zeroed and an unpin
        broadcast is sent across the federation. Bytes on volunteer
        disks may persist as unrecoverable ciphertext.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Soft-delete accepted (owner or operator). }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The blob is not active (already soft-deleted, quarantined, or tombstoned).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

