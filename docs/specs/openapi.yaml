  # =========================================================================
  # Users
  # =========================================================================

  # =========================================================================
  # Auth (local OIDC-shaped JWT issuer for management/bearer auth; distinct
  # from the HMAC signed-URL scheme in SIGNED_URL_FORMAT.md). In external-OIDC
  # mode (auth.issuer_url set) login/refresh/logout/jwks return 404
  # external_oidc_active; only /auth/config responds, advertising the external
  # IdP for the client to drive the authorization-code + PKCE flow.
  # =========================================================================

  /api/v1/auth/login:
    post:
      tags: [admin]
      operationId: authLogin
      summary: Exchange username + password for an access + refresh token pair (local issuer).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              username: operator
              password: correct-horse-battery-staple
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Token pair.
          content:
            application/json:
              example:
                access_token: eyJhbGciOiJFZERTQSIsImtpZCI6InNpZy0yMDI2LTA3In0...
                refresh_token: v1.MEQCIB3q...c2VjcmV0.9f2b1a7c
                token_type: bearer
                expires_in: 900
                kid: sig-2026-07
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: >-
            Authentication failed. The response is deliberately
            identical for an unknown username and a wrong password so
            the endpoint cannot be used to enumerate accounts, and it is
            rate-limited per address. Repeated failures will begin
            returning `503` before they return anything more
            informative.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >-
            This coordinator is configured to delegate authentication to
            an external OIDC provider, so its own token issuer is
            switched off and the route does not exist. Obtain a token
            from the configured provider instead; `GET
            /api/v1/auth/config` reports which mode is active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: >-
            The login path is shedding load: either the per-address rate
            limit tripped or the bounded password-hashing pool is
            saturated. This is back-pressure rather than a failure —
            honour `Retry-After` where it is present and retry with
            backoff. Credentials were not evaluated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/refresh:
    post:
      tags: [admin]
      operationId: authRefresh
      summary: Rotate a refresh token for a new pair (single-use; reuse revokes the family).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              refresh_token: v1.MEQCIB3q...c2VjcmV0.9f2b1a7c
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              example:
                access_token: eyJhbGciOiJFZERTQSIsImtpZCI6InNpZy0yMDI2LTA3In0...
                refresh_token: v1.MEQCIFp7...c2VjcmV0.31d8c04a
                token_type: bearer
                expires_in: 900
                kid: sig-2026-07
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: >-
            The refresh token was rejected. It was expired, already
            revoked, or — the case worth knowing about — presented a
            second time. Refresh tokens are single-use, and replay is
            treated as evidence of theft: the whole token family is
            revoked, which logs out every session descended from that
            login. Authenticate again with credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >-
            This coordinator is configured to delegate authentication to
            an external OIDC provider, so its own token issuer is
            switched off and the route does not exist. Obtain a token
            from the configured provider instead; `GET
            /api/v1/auth/config` reports which mode is active.

  /api/v1/auth/logout:
    post:
      tags: [admin]
      operationId: authLogout
      summary: Revoke a refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              refresh_token: v1.MEQCIB3q...c2VjcmV0.9f2b1a7c
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Logged out (idempotent). }
        '404':
          description: >-
            This coordinator is configured to delegate authentication to
            an external OIDC provider, so its own token issuer is
            switched off and the route does not exist. Obtain a token
            from the configured provider instead; `GET
            /api/v1/auth/config` reports which mode is active.

  /api/v1/auth/jwks.json:
    get:
      tags: [admin]
      operationId: authJWKS
      summary: JSON Web Key Set for verifying local-issuer access tokens.
      security: []
      responses:
        '200':
          description: JWKS (OKP/Ed25519 signing key).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
        '404':
          description: >-
            This coordinator is configured to delegate authentication to
            an external OIDC provider, so its own token issuer is
            switched off and the route does not exist. Obtain a token
            from the configured provider instead; `GET
            /api/v1/auth/config` reports which mode is active.

  /api/v1/auth/config:
    get:
      tags: [admin]
      operationId: authConfig
      summary: Unauthenticated auth-mode discovery document for clients (SPA/CLI).
      description: |
        Always present in both modes. In local mode returns `{mode: local}`.
        In external mode returns the IdP `issuer_url` (and `client_id`/`scopes`)
        so the client can initiate the OIDC authorization-code + PKCE flow itself.
      security: []
      responses:
        '200':
          description: Auth discovery document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthConfig' }

  /api/v1/users/me:
    get:
      tags: [metadata]
      operationId: getCurrentUser
      summary: Return the authenticated user's profile.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # =========================================================================
  # Search (perceptual)
  # =========================================================================

  /api/v1/search/perceptual:
    get:
      tags: [search]
      operationId: searchPerceptual
      summary: Find images perceptually similar to a given CID.
      description: |
        Uses the in-memory BK-tree index over PDQ hashes. By default
        operator-only (deduplication tooling); operators may flip a
        config to expose to authenticated users.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cid
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Cid' }
        - name: max_distance
          in: query
          description: Maximum Hamming distance over the 256-bit hash.
          schema:
            type: integer
            minimum: 0
            maximum: 64
            default: 5
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Near-duplicate matches.
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      required: [cid, distance]
                      properties:
                        cid: { $ref: '#/components/schemas/Cid' }
                        distance: { type: integer, minimum: 0 }

  # =========================================================================
  # Admin (operator + moderator)
  # =========================================================================

  /api/v1/admin/nodes:
    get:
      tags: [admin]
      operationId: listNodes
      summary: List federated pinning nodes.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Node list.
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items: { $ref: '#/components/schemas/Node' }

  /api/v1/admin/nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/NodeIdParam'
    get:
      tags: [admin]
      operationId: getNode
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Node detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/nodes/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/NodeIdParam'
    post:
      tags: [admin]
      operationId: revokeNode
      summary: Mark a node compromised; revoke its cert and re-replicate its pins.
      description: |
        The poison-pill protocol from `FEDERATION_PROTOCOL.md`.

        On revocation the coordinator (a) revokes the node's Nebula
        certificate, (b) tombstones the node's pin assignments,
        (c) emits the `federation.node_revoked` webhook, and
        (d) enqueues re-replication for any CIDs whose factor
        dropped below target.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            example:
              reason: Host reported compromised by its operator on 2026-07-29.
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '202':
          description: Revocation accepted; healing dispatched asynchronously.
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/pins:
    get:
      tags: [admin]
      operationId: listPins
      summary: List pin assignments (filterable).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: state
          in: query
          schema:
            type: string
            enum: [pending, acked, failed, unpinning]
        - name: node_id
          in: query
          schema: { type: string, format: uuid }
        - name: cid
          in: query
          schema: { $ref: '#/components/schemas/Cid' }
      responses:
        '200':
          description: Pin assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPinAssignments'

  /api/v1/admin/moderation/quarantine:
    post:
      tags: [admin]
      operationId: moderationQuarantine
      summary: Quarantine a CID (blocks reads, preserves bytes for counter-notice window).
      description: |
        Sets the blob and its derivatives to `quarantined`, inserts a
        signed-URL revocation, and schedules a tombstone after
        `tombstone_after` (default 14 days). With `legal_hold: true` the
        DEK(s) are pinned (`legal_hold = true` in `data_encryption_keys`)
        and no `scheduled_tombstone_at` is set — crypto-shred is refused
        at the DB layer until `POST /moderation/clear-legal-hold`.

        Requires `operator` or `moderator` role.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              cid: bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
              rule: dmca
              case_id: 6c3f0a4e-6b1c-4a2f-9d55-1c0d9b7a2e11
              reason: DMCA notice received; holding bytes for the counter-notice window.
              legal_hold: true
            schema:
              type: object
              required: [cid, reason]
              properties:
                cid: { $ref: '#/components/schemas/Cid' }
                rule:
                  type: string
                  enum: [dmca, severe_content, operator_manual]
                case_id:
                  type: string
                  format: uuid
                  nullable: true
                reason: { type: string }
                tombstone_after:
                  type: string
                  description: |
                    Duration string e.g. `"14d"` or `"336h"`. Default `14d`.
                  default: '14d'
                legal_hold:
                  type: boolean
                  default: false
      responses:
        '200':
          description: CID quarantined.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/moderation/takedown:
    post:
      tags: [admin]
      operationId: moderationTakedown
      summary: Immediate tombstone + crypto-shred of a CID (local Kubo unpin after commit).
      description: |
        Bypasses the counter-notice window: tombstones and shreds the DEK
        immediately. Returns `409 legal_hold` if the DEK carries a
        legal-hold flag (use `clear-legal-hold` first). The local Kubo
        unpin is best-effort after commit; federation unpin broadcast is
        Phase 2.

        Requires `operator` or `moderator` role.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              cid: bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
              case_id: 6c3f0a4e-6b1c-4a2f-9d55-1c0d9b7a2e11
              reason: Uncontested DMCA notice; counter-notice window elapsed.
            schema:
              type: object
              required: [cid, reason]
              properties:
                cid: { $ref: '#/components/schemas/Cid' }
                case_id:
                  type: string
                  format: uuid
                  nullable: true
                reason: { type: string }
      responses:
        '200':
          description: CID tombstoned and DEK shredded.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The blob's data encryption key carries a legal hold, and the
            database refuses to shred a held key. This is the intended
            interlock: it stops a takedown destroying evidence that a
            live matter requires. Clear the hold with `POST
            /api/v1/admin/moderation/clear-legal-hold` first, then
            retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/moderation/clear-legal-hold:
    post:
      tags: [admin]
      operationId: moderationClearLegalHold
      summary: Clear the legal-hold flag on a CID so the next sweep tombstones it (operator-only).
      description: |
        Clears `data_encryption_keys.legal_hold` for the parent and all
        derivatives, sets `scheduled_tombstone_at = now()` on the originating
        quarantine decision, and writes an audit row. The ≈1-minute sweep
        will tombstone and shred on its next tick.

        **Operator role required** — moderators receive `403`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              cid: bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
              case_ref: DMCA-2026-0117
              reason: Matter closed; hold released so the scheduled shred can proceed.
            schema:
              type: object
              required: [cid, reason]
              properties:
                cid: { $ref: '#/components/schemas/Cid' }
                case_ref: { type: string, nullable: true }
                reason: { type: string }
      responses:
        '200':
          description: Legal hold cleared; tombstone scheduled.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/moderation/restore:
    post:
      tags: [admin]
      operationId: moderationRestore
      summary: Restore a quarantined CID to active (only valid from quarantined state).
      description: |
        Sets the blob and its derivatives back to `active` and clears
        `scheduled_tombstone_at`. The `(cid, cid)` signed-URL revocation
        is **not** removed (it is indistinguishable from a manual operator
        revocation; re-mint new signed URLs after restore if needed).
        Returns `409` if the blob is not in `quarantined` state.

        Requires `operator` or `moderator` role.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              cid: bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
              reason: Counter-notice accepted; quarantine lifted.
            schema:
              type: object
              required: [cid, reason]
              properties:
                cid: { $ref: '#/components/schemas/Cid' }
                reason: { type: string }
      responses:
        '200':
          description: CID restored to active.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Restore applies only to a blob currently in `quarantined`.
            The target is in some other state — already active, or
            tombstoned, which is terminal because the key is gone. `GET
            /api/v1/admin/blobs/{cid}` reports the current state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/moderation/counter-notice:
    post:
      tags: [admin]
      operationId: moderationCounterNotice
      summary: Record a counter-notice and clear the scheduled tombstone.
      description: |
        Clears `scheduled_tombstone_at` so the sweep will not auto-tombstone
        during the counter-notice review window. The blob remains
        `quarantined`; the operator later restores or lets a renewed schedule
        proceed to tombstone. Appends `notes` to the associated DMCA case.

        Requires `operator` or `moderator` role.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              cid: bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
              notes: Uploader supplied a licence; forwarded to the claimant 2026-07-28.
            schema:
              type: object
              required: [cid, notes]
              properties:
                cid: { $ref: '#/components/schemas/Cid' }
                notes: { type: string }
      responses:
        '200':
          description: Counter-notice recorded; tombstone schedule cleared.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/moderation/queue:
    get:
      tags: [admin]
      operationId: listModerationQueue
      summary: List pending moderation decisions.
      security: [{ bearerAuth: [] }]
      parameters:
