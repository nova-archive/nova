<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nova — a federated archive for binary objects">
  <defs>
    <style>
      .wm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>
  <!-- Brand paper card: self-contained so the banner reads on both light and dark GitHub themes. -->
  <rect x="0" y="0" width="1280" height="360" rx="20" fill="#ECE8DF"/>
  <rect x="0" y="0" width="1280" height="6" rx="3" fill="#E2502B"/>

  <!-- Nova mark: compass starburst, ink with a brand-red core. viewBox mark is 64x64 centred at (32,32); scaled x4.4 and placed. -->
  <g transform="translate(230 180) scale(4.4)">
    <g fill="#111114">
      <polygon points="0,-30 3,-3 -3,-3"/>
      <polygon points="0,-30 3,-3 -3,-3" transform="rotate(90)"/>
      <polygon points="0,-30 3,-3 -3,-3" transform="rotate(180)"/>
      <polygon points="0,-30 3,-3 -3,-3" transform="rotate(270)"/>
      <polygon points="0,-17 2,-3 -2,-3" transform="rotate(45)"/>
      <polygon points="0,-17 2,-3 -2,-3" transform="rotate(135)"/>
      <polygon points="0,-17 2,-3 -2,-3" transform="rotate(225)"/>
      <polygon points="0,-17 2,-3 -2,-3" transform="rotate(315)"/>
    </g>
    <circle cx="0" cy="0" r="3.4" fill="#E2502B"/>
  </g>

  <!-- Wordmark + descriptor -->
  <text class="wm" x="470" y="205" font-size="150" font-weight="700" letter-spacing="-7" fill="#111114">nova</text>
  <text class="wm" x="476" y="262" font-size="30" font-weight="500" letter-spacing="0.5" fill="#3C4756">A federated archive for binary objects.</text>
  <text class="wm" x="476" y="300" font-size="19" font-weight="500" letter-spacing="2.5" fill="#7A8595">SELF-HOSTED · CONTENT-ADDRESSED · DONOR-BLIND</text>
</svg>
