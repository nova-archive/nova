# Dependabot keeps the four ecosystems current. Alerts and update PRs are
# triaged per-milestone (see CONTRIBUTING.md "Toolchain currency"), never
# auto-merged.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Watches the digest-pinned FROM lines in docker/*.Dockerfile (P2-M7.1).
  # Digest pins without a watcher rot silently.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
