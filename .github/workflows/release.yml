# Nova release (P2-M7.3, D-M7.3-2e, D-M7.3-16).
#
# ============================================================================
# ONE STABLE SIGNING PRINCIPAL
# ============================================================================
#
# This workflow runs from protected `main`, with the candidate commit passed as
# an immutable INPUT. Not from a tag ref — the tag does not exist when the
# candidate is signed, and it is this workflow's own state machine that creates
# it, only after the promoted digests have been read back.
#
# GitHub's `workflow_ref` carries both the workflow path AND the Git ref, so the
# identity a Cosign policy must admit is written out exactly:
#
#   https://github.com/nova-archive/nova/.github/workflows/release.yml@refs/heads/main
#
# It is the same identity for the first release and every later one. It appears
# verbatim in releases/verification-policy.txt, in scripts/nova-release, and in
# the documented bootstrap command; a test fails if they disagree.
#
# The FIRST step of the first job refuses to run from any other ref. Checking
# that the candidate commit is an ancestor of main is not the same check:
# `workflow_dispatch` lets the operator choose the branch the workflow RUNS on,
# and a run from another branch would mint certificates under a different
# identity — ones no operator's policy admits, on images that look released.
#
# ============================================================================
# THE STATE MACHINE, AND WHY THE ORDER
# ============================================================================
#
#   1. validate      preconditions, and the PLAN of what must be proven
#   2. candidate     build + push descriptors ONCE; sign, attest, verify
#   3. evidence      run the planned gates AGAINST THE PUSHED IMAGES
#   4. lock          assemble the bundle, finalize and sign the lock, verify it
#   5. approval      a human, at the protected `release` environment
#   6. promote       version tags with read-back, Git tag, publication
#   7. transition    the post-publication gate; completion state 4
#
# Build once, then promote. Rebuilding to produce a "release" image would change
# the digest the lock already committed to, which is the circularity this whole
# design exists to break: stamping version and labels alters the image config,
# which alters the manifest digest.
#
# ============================================================================
# WHAT `dry_run: true` DOES AND DOES NOT DO
# ============================================================================
#
# It runs 1 through 4 and stops. That is a REHEARSAL, not a no-op: it pushes
# candidate images to a candidate tag, signs them, and mints real Sigstore
# certificates that are in the public transparency log forever.
#
# What it does not do is promote a version tag, create a Git tag, or publish a
# release — the three writes that constitute "a release exists". A candidate tag
# nobody was told about is an untidy registry; a published version tag is a
# promise.
#
# For a rehearsal that touches nothing at all, `make release-pipeline-rehearsal`
# runs the whole document pipeline offline against synthesized descriptors.
#
# ============================================================================
# GIT TAGS AND OCI TAGS ARE DIFFERENT THINGS
# ============================================================================
#
# `v0.3.0` as a Git tag names a commit. `v0.3.0` as an OCI tag names a manifest,
# and is MUTABLE — anyone with push access can repoint it. Nothing in Nova ever
# resolves an OCI tag at deploy time; the lock carries digests. The OCI tag
# exists only so a human browsing the registry can find the release.
#
# ============================================================================
# NOTHING HERE IS HARD-CODED TO ONE RELEASE
# ============================================================================
#
# No version, commit, schema, predecessor or gate list appears below. The gates
# to run come from `novarel plan`, which derives them from the intent's claims;
# the predecessor comes from the intent; the schema comes from the lock. A
# second release changes releases/intent/vX.Y.Z.json and nothing else, and
# `make release-pipeline-rehearsal` proves that offline against a synthetic
# second release before anybody dispatches this.

name: release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: >-
          The full 40-character commit SHA to release. Immutable by
          construction: a branch name would let the content change between
          approval and promotion.
        required: true
        type: string
      version:
        description: The product version, e.g. v1.2.3. Must match a checked-in intent.
        required: true
        type: string
      dry_run:
        description: >-
          Build, sign, gate and lock, but do not promote, tag or publish. Still
          pushes and signs candidate images.
        required: false
        default: true
        type: boolean
      transition_runner:
        description: >-
          Runner for the post-publication transition gate. It needs Docker; a
          self-hosted label goes here when it needs anything the hosted runner
          does not have.
        required: false
        default: ubuntu-latest
        type: string

# Least privilege at the top; each job widens only what it needs.
permissions:
  contents: read

# One release at a time, and never cancelled midway: a cancelled run between
# two external writes is exactly the state the idempotent recovery is for, but
# not having to exercise it is better.
concurrency:
  group: nova-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: nova-archive
  COSIGN_IDENTITY: https://github.com/nova-archive/nova/.github/workflows/release.yml@refs/heads/main
  COSIGN_ISSUER: https://token.actions.githubusercontent.com

jobs:
  # ==========================================================================
  # 1. Preconditions, and the plan of what must be proven.
  # ==========================================================================
  validate:
    runs-on: ubuntu-latest
    outputs:
      # Only the candidate tag crosses a job boundary. Everything else the
      # later jobs need is in plan.json, which they download — one artifact
      # every job reads beats five outputs that can disagree with it.
      candidate_tag: ${{ steps.plan.outputs.candidate_tag }}
    steps:
      # BEFORE the checkout. The ref decides the signing identity, and a run
      # that got as far as checking out a branch it must not sign from has
      # already spent the reviewer's attention.
      - name: This workflow may only run from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::this run is on $REF. Releases are cut from refs/heads/main and only"
            echo "from there: GitHub's workflow_ref carries the REF as well as the path, so a"
            echo "run from anywhere else mints Sigstore certificates under an identity no"
            echo "operator policy admits — on images that would look released."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      # Workflow inputs reach shell through the ENVIRONMENT, never through
      # ${{ }} interpolation into a run block. Only someone with write access
      # can dispatch this, but "the attacker would need write access" is a
      # reason to keep the habit rather than to drop it: a future trigger change
      # would silently turn these into injection points.
      - name: The candidate must be a full SHA on protected main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          case "$CANDIDATE_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::candidate_sha must be a full 40-character lowercase SHA."; exit 1 ;;
          esac
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main \
            || { echo "::error::that commit is not on main. Releases are cut from protected" \
                      "main so one signing principal covers every release."; exit 1; }

      - name: The version must be canonical, and must not already be taken
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::the version is not a canonical vMAJOR.MINOR.PATCH tag"; exit 1 ;;
          esac
          case "$VERSION" in
            *[!v0-9.-]*|*/*) echo "::error::the version carries characters a tag must not"; exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::that Git tag already exists. A release is immutable; cut a new" \
                 "version rather than moving a tag."
            exit 1
          fi
          # A published release with no tag in this checkout is still a taken
          # version. Catching it here costs a second; catching it in `promote`
          # costs a signed candidate.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::a GitHub Release named $VERSION already exists."
            exit 1
          fi

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod

      - name: The intent is checked in, valid, and names this version
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          go run ./internal/release/cmd/novarel validate
          go run ./internal/release/cmd/novarel catalog --check

          # The PLAN. Which gates run, which claims each supports, which
          # capabilities and scenarios each exercises — all derived from the
          # reviewed intent. A hard-coded gate list would let a later release
          # declare a claim and silently never run the gate that proves it.
          go run ./internal/release/cmd/novarel plan --version "$VERSION" --out plan.json
          cat plan.json

          # The candidate OCI tag carries BOTH the version and the commit. Two
          # versions cut from one commit would otherwise collide on one tag, and
          # the second would promote the first's digests.
          tag="$(./scripts/release-publish.sh candidate-tag --version "$VERSION" --sha "$CANDIDATE_SHA")"
          echo "candidate_tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-plan
          path: plan.json
          if-no-files-found: error

      - name: Gate coverage carries no placeholder
        run: |
          # A release candidate is impossible while any PRE-publication gate's
          # coverage is the INTENDED shape rather than an executed result.
          # Without this, a claim reaches a signed lock with nothing behind it.
          go test ./internal/release/ -run TestPlaceholderCoverageBlocksReleaseCandidate -count=1 -v 2>&1 | tee /tmp/cov.log
          if grep -q "the checked-in table still has placeholders" /tmp/cov.log; then
            echo "::error::gate coverage still has placeholders; see the test output above."
            exit 1
          fi

      - name: Every artifact gate
        run: make artifact-gates

      - name: The publication path is safe to interrupt
        run: make release-publish-injection

  # ==========================================================================
  # 2. Build + push candidate descriptors ONCE, then sign and attest them.
  # ==========================================================================
  candidate:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    strategy:
      # Fail the whole matrix on the first failure. A partial candidate — two
      # of three images signed — is a state the lock cannot describe.
      fail-fast: true
      matrix:
        include:
          - name: nova-coordinator
            dockerfile: docker/coordinator.Dockerfile
          - name: nova-node
            dockerfile: docker/node.Dockerfile
          - name: nova-admin
            dockerfile: docker/admin.Dockerfile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The platform set comes from the reviewed intent, not from a literal
      # here. Nova is single-platform by DECISION or multi-platform by decision;
      # what it must not be is either one because of a YAML line nobody read.
      # The lock refuses a descriptor whose platforms are not exactly these.
      - name: Platforms, from the intent
        id: platforms
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - "releases/intent/${VERSION}.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          print("list=" + ",".join(json.load(open(sys.argv[1]))["platforms"]))
          PY

      # Binaries are stamped with the INTENDED FINAL VERSION, not a candidate
      # placeholder. Stamping changes the image config and therefore the
      # manifest digest, so a "candidate" stamp would mean the released image is
      # not the image that was signed.
      #
      # Pushed to a candidate OCI tag. Promotion later adds the version tag to
      # the SAME digest; it does not rebuild.
      - name: Build + push by digest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ steps.platforms.outputs.list }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ needs.validate.outputs.candidate_tag }}
          build-args: |
            NOVA_VERSION=${{ inputs.version }}
            NOVA_REVISION=${{ inputs.candidate_sha }}
            NOVA_BUILD_DATE=${{ github.event.repository.updated_at }}

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign the digest
        env:
          REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: SBOM for the pushed digest, attested to it
        env:
          REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}@${{ steps.push.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          syft "$REF" -o "spdx-json=${NAME}.sbom.spdx.json"
          cosign attest --yes --type spdxjson --predicate "${NAME}.sbom.spdx.json" "$REF"

      # VERIFY WHAT WAS JUST PRODUCED, with the policy an OPERATOR will use.
      # Signing and then not checking is a ritual: it proves the signing step
      # ran, not that the result is verifiable by anyone else.
      #
      # All three materials, not two. An SBOM that was attested but does not
      # verify is worse than no SBOM: it is a supply-chain document that looks
      # checkable and is not, and nobody discovers that until they need it.
      - name: Verify signature, provenance AND SBOM against the release policy
        env:
          REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_ISSUER" "$REF"
          cosign verify-attestation --type slsaprovenance \
            --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_ISSUER" "$REF"
          cosign verify-attestation --type spdxjson \
            --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_ISSUER" "$REF"

      # A COMPLETE descriptor: digest, mediaType, size, platform, and the child
      # descriptors when it is an index. A bare digest cannot say whether it
      # names an index or a manifest, and promotion treats the two differently.
      - name: Record the descriptor
        env:
          NAME: ${{ matrix.name }}
        run: |
          mkdir -p descriptors
          ./scripts/release-descriptor.sh \
            --repository "${REGISTRY}/${OWNER}/${NAME}" \
            --digest "${{ steps.push.outputs.digest }}" \
            --out "descriptors/${NAME}.json"
          cat "descriptors/${NAME}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: descriptor-${{ matrix.name }}
          path: descriptors/${{ matrix.name }}.json
          if-no-files-found: error

  # ==========================================================================
  # 3. The planned gates, run AGAINST THE PUSHED IMAGES, and their evidence.
  # ==========================================================================
  evidence:
    needs: [validate, candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: descriptor-*
          path: descriptors
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-plan
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libvips headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev

      # NOVA_CANDIDATE_DESCRIPTORS is what makes these gates test the RELEASE.
      # With it, scripts/lib/candidate.sh pulls each image by digest and
      # extracts the binaries; without it, each gate rebuilds from the working
      # tree. Same source, different bytes — and a gate that rebuilds has read
      # a descriptor rather than examined an artifact.
      #
      # The gates come from the plan, in the plan's order, and every one of them
      # gets a statement whether it passes or is skipped. A gate that produced
      # nothing at all would fail at the lock, after the whole matrix had run.
      - name: Run the planned gates and emit signed-able evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          NOVA_CANDIDATE_DESCRIPTORS: ${{ github.workspace }}/descriptors
          NOVA_CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          go build -o /tmp/novarel ./internal/release/cmd/novarel
          test_revision="$(git rev-parse HEAD)"

          while read -r gate target; do
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "::group::$gate ($target)"
            if ! make "$target" 2>&1 | tee "/tmp/$gate.log"; then
              echo "::error::$gate FAILED against the candidate digests."
              echo "No statement is emitted for a failed gate: a statement is what a claim"
              echo "cites, and there is nothing here to cite. Nothing has been promoted,"
              echo "tagged or published; the candidate images remain on their candidate tag."
              exit 1
            fi
            echo "::endgroup::"

            # A gate that SKIPPED exited zero and demonstrated nothing. Emitting
            # a passing statement for it would put a claim in a signed lock with
            # nothing behind it — which is the one failure the whole evidence
            # model exists to prevent, arrived at through an exit code.
            if grep -q "^SKIPPED:" "/tmp/$gate.log"; then
              echo "::error::$gate SKIPPED. A skip is a recorded absence, and a claim cannot"
              echo "be proven by one. Whatever it needed is missing from this runner."
              exit 1
            fi

            /tmp/novarel evidence \
              --plan plan.json --gate "$gate" \
              --commit "$CANDIDATE_SHA" --test-revision "$test_revision" \
              --artifacts descriptors --started "$started" \
              --out "evidence/$gate.json"
            echo "$gate -> $(sha256sum < "evidence/$gate.json" | cut -d' ' -f1)"
          done < <(python3 -c 'import json
          p = json.load(open("plan.json"))
          for g in p["pre_publication_gates"]:
              print(g["gate"], g["make_target"])')

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: evidence/
          if-no-files-found: error

  # ==========================================================================
  # 4. The bundle, the lock, its signature, and the reviewer's summary.
  # ==========================================================================
  lock:
    needs: [validate, candidate, evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: descriptor-*
          path: descriptors
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: evidence
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # The order is forced and it is the acyclic authentication graph:
      #
      #   payload members → payload map → hashes.txt (derived from the map, then
      #   covered by it) → the lock, which carries the map → the signature,
      #   which lands OUTSIDE the payload because a lock cannot hash the file
      #   containing the signature over it.
      - name: Assemble the bundle and finalize the lock
        id: build
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          go build -o /tmp/novarel ./internal/release/cmd/novarel

          /tmp/novarel bundle --version "$VERSION" --out bundle --evidence evidence
          /tmp/novarel lock --version "$VERSION" --commit "$CANDIDATE_SHA" \
            --bundle bundle --artifacts descriptors --evidence evidence \
            --out bundle/lock.json | tee /tmp/lock.out

          digest="$(python3 -c 'import hashlib;print("sha256:"+hashlib.sha256(open("bundle/lock.json","rb").read()).hexdigest())')"
          echo "lock_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the lock, then verify it with the OPERATOR's policy
        env:
          LOCK_DIGEST: ${{ steps.build.outputs.lock_digest }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle bundle/lock.sigstore.json bundle/lock.json

          # Verified with the identity and issuer an operator is told to type,
          # not with whatever cosign would default to. This is the one check
          # that says the document is usable by somebody who does not trust
          # this run — which is every operator.
          cosign verify-blob \
            --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_ISSUER" \
            --bundle bundle/lock.sigstore.json bundle/lock.json

          # And the signature is over the bytes whose digest the summary quotes.
          got="$(python3 -c 'import hashlib;print("sha256:"+hashlib.sha256(open("bundle/lock.json","rb").read()).hexdigest())')"
          [ "$got" = "$LOCK_DIGEST" ] || {
            echo "::error::the lock changed between building and signing it"; exit 1; }

      - name: The bundle verifies exactly as an operator's will
        env:
          LOCK_DIGEST: ${{ steps.build.outputs.lock_digest }}
        run: |
          # scripts/nova-release travels INSIDE the bundle, and re-establishes
          # the chain from a digest supplied out of band. Running it here is the
          # last chance to discover that the thing being published does not
          # verify — before the first operator does.
          ./bundle/scripts/nova-release verify --bundle bundle --lock-digest "$LOCK_DIGEST"

      - name: What the reviewer is approving
        env:
          VERSION: ${{ inputs.version }}
        run: |
          go run ./internal/release/cmd/novarel summary --version "$VERSION" \
            --lock bundle/lock.json --evidence evidence >> "$GITHUB_STEP_SUMMARY"

      - name: Pack the bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tar -czf "nova-$VERSION-bundle.tar.gz" -C bundle .
          mkdir -p release-assets
          cp bundle/lock.json bundle/lock.sigstore.json bundle/intent.json \
             bundle/hashes.txt bundle/verification-policy.txt release-assets/
          cp "nova-$VERSION-bundle.tar.gz" release-assets/
          cp bundle/UPGRADING.md release-assets/
          ls -l release-assets

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: release-assets/
          if-no-files-found: error

  # ==========================================================================
  # 5-6. Approval, promotion with read-back, the Git tag, publication.
  # ==========================================================================
  promote:
    needs: [validate, candidate, evidence, lock]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # The approval gate. Configured on the repository, not here, so it cannot be
    # removed by editing this file in the same PR that would abuse it. The
    # reviewer reads the lock job's summary: digests, claims, evidence.
    environment: release
    permissions:
      contents: write # the Git tag and the GitHub Release
      packages: write # the OCI version tag
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: descriptor-*
          path: descriptors
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: release-assets

      # Every write below is no-overwrite and exact-match resume, and every
      # interruption point between them is exercised by
      # `make release-publish-injection` on every PR.
      - name: Promote the OCI version tags, then read them back
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/release-publish.sh promote-oci --version "$VERSION" --descriptors descriptors

      # ONLY NOW. Every write before this point is a registry tag; a Git tag on
      # a public repository is fetched by everyone and should be immovable by
      # ruleset.
      - name: Create the Git product tag
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: ./scripts/release-publish.sh git-tag --version "$VERSION" --sha "$CANDIDATE_SHA"

      # Draft FIRST, attach, then publish. A release that exists before its lock
      # is attached is one an operator can download without the document that
      # authenticates it.
      - name: Publish the release with every asset attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          args=()
          for f in release-assets/*; do
            [ "$(basename "$f")" = UPGRADING.md ] && continue
            args+=(--asset "$f")
          done
          ./scripts/release-publish.sh publish \
            --version "$VERSION" --sha "$CANDIDATE_SHA" \
            --notes release-assets/UPGRADING.md "${args[@]}"

      - name: The published tags resolve to the locked descriptors
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/release-publish.sh verify-published --version "$VERSION" --descriptors descriptors

  # ==========================================================================
  # 7. The post-publication gate. Completion state 4.
  # ==========================================================================
  #
  # It runs in the SAME dispatch, deliberately. An `on: release: published`
  # workflow would not fire at all: events created with GITHUB_TOKEN do not
  # trigger further workflow runs, so the gate would silently never run and the
  # milestone would sit at state 3 looking finished.
  #
  # If it fails, the release stays published. That is not a compromise — it is
  # the only correct behaviour. The lock was signed before this could run, and
  # re-cutting it would make the signature cover a different set of claims than
  # the one that was reviewed. So: completion remains state 3, only this job is
  # retried, and the release is never re-cut.
  transition:
    needs: [validate, promote]
    if: ${{ !inputs.dry_run && needs.promote.result == 'success' }}
    runs-on: ${{ inputs.transition_runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-plan
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libvips headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev

      # From the PUBLISHED release, not from the workflow artifact. The artifact
      # is what this run produced; the release is what an operator downloads,
      # and they are only the same thing if publication worked.
      - name: Download the published release and authenticate it out of band
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$VERSION" --dir published --clobber
          tar -xzf "published/nova-$VERSION-bundle.tar.gz" -C published

          # Exactly the command docs/UPGRADING.md tells an operator to run,
          # with the identity and issuer hard-coded rather than read from the
          # bundle. Nothing from the bundle has executed at this point.
          cosign verify-blob \
            --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_ISSUER" \
            --bundle published/lock.sigstore.json published/lock.json

          digest="$(python3 -c 'import hashlib;print("sha256:"+hashlib.sha256(open("published/lock.json","rb").read()).hexdigest())')"
          echo "lock_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "the published lock authenticates: $digest"

      - name: The post-publication transition
        id: gate
        env:
          NOVA_RELEASE_BUNDLE: ${{ github.workspace }}/published
          NOVA_RELEASE_LOCK_DIGEST: ${{ steps.download.outputs.lock_digest }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started=$started" >> "$GITHUB_OUTPUT"
          while read -r gate target; do
            echo "::group::$gate ($target)"
            if ! make "$target" 2>&1 | tee "/tmp/$gate.log"; then
              echo "::error::$gate failed. The release STAYS PUBLISHED and completion remains"
              echo "state 3; retry this job alone. The lock is not re-cut."
              exit 1
            fi
            if grep -q "^SKIPPED:" "/tmp/$gate.log"; then
              echo "::error::$gate skipped against a release that exists. A skip here is not"
              echo "evidence of a transition; completion remains state 3."
              exit 1
            fi
            echo "::endgroup::"
          done < <(python3 -c 'import json
          p = json.load(open("plan.json"))
          for g in p["post_publication_gates"]:
              print(g["gate"], g["make_target"])')

      # The statement records the PUBLISHED descriptors. It is attached to the
      # run and to the ledger commit, and it is never folded back into the lock.
      - name: Record completion state 4
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STARTED: ${{ steps.gate.outputs.started }}
        run: |
          set -euo pipefail
          go build -o /tmp/novarel ./internal/release/cmd/novarel
          mkdir -p completion descriptors
          python3 - published/lock.json <<'PY'
          import json, os, sys
          lock = json.load(open(sys.argv[1]))
          os.makedirs("descriptors", exist_ok=True)
          for name, a in lock["artifacts"].items():
              json.dump(a, open("descriptors/%s.json" % name, "w"), indent=2)
          PY
          while read -r gate; do
            /tmp/novarel evidence --plan plan.json --gate "$gate" \
              --commit "$CANDIDATE_SHA" --artifacts descriptors \
              --started "$STARTED" --out "completion/$gate.json"
          done < <(python3 -c 'import json
          p = json.load(open("plan.json"))
          for g in p["post_publication_gates"]:
              print(g["gate"])')

          /tmp/novarel completion --evidence completion --release "$VERSION"

          {
            echo "## Completion state 4 reached for $VERSION"
            echo
            echo "The post-publication transition passed against the published release."
            echo "The lock is **not** re-cut and this result is not folded into it."
            echo
            echo "Record it in the ledger with a commit that flips the ROADMAP row to ✅"
            echo "and attaches these statement digests:"
            echo
            echo '```'
            for f in completion/*.json; do
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: completion-evidence
          path: completion/
          if-no-files-found: error
