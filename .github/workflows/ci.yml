name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that push/sign/attest widen explicitly.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: --privileged
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev libheif-dev libjxl-dev

      - name: Go vet
        run: go vet ./...

      - name: sqlc codegen drift
        run: make codegen-check

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev libheif-dev libjxl-dev

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  web-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Type-check (admin SPA)
        run: make admin-lint

      - name: Unit tests (admin SPA)
        run: make admin-test

      - name: Build (admin SPA)
        run: make admin-build

      - name: Hermetic bundle audit
        run: make hermetic-spa

      - name: Type-check (widget)
        run: make widget-lint

      - name: Unit tests (widget)
        run: make widget-test

      - name: Build (widget)
        run: make widget-build

      - name: Hermetic widget bundle audit
        run: make hermetic-widget

      - name: Type-check (setup wizard)
        run: make setup-lint

      - name: Unit tests (setup wizard)
        run: make setup-test

      - name: Build (setup wizard)
        run: make setup-build

      - name: Hermetic setup bundle audit
        run: make hermetic-setup

  migrations-frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Shipped migrations are immutable
        run: make migrations-frozen

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image (no push)
        run: make docker-build

  # Full-stack e2e against the shipped compose artifact: image build →
  # headless setup → prod profile → upload/read/transform/delete via nginx.
  # On failure smoke.sh itself dumps the last 50 compose log lines to stderr
  # (the EXIT trap tears the stack down, so a post-failure log step would
  # capture nothing). ubuntu-latest ships docker + compose v2 natively.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: End-to-end smoke (compose prod stack)
        run: make smoke

  donor-deps-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: cmd/node dependency boundary
        run: make node-deps-check

  # P2-M7.2 (D-M7.2-10): the deployment artifacts must agree with each other and
  # with the binary. Docs rot is what produced the federation productization
  # finding — six independently maintained sources of truth that had already
  # diverged on ports, topology, paths, secrets and CLI flags, with nothing
  # failing. Cheap and hermetic, so it runs on every PR.
  # ── TIER 1: pr-static ──────────────────────────────────────────────────
  #
  # Hermetic. No registry, no TUN, no privileged networking. Runs on every push
  # and every pull request, including from forks.
  #
  # A gate in this tier may NEVER satisfy a claim that needs an executed one:
  # release.EvidenceRef records the runner class precisely so a static check
  # cannot stand in for a drill (P2-M7.3, D-M7.3-17).
  deployment-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: deploy/donor matches the canonical templates
        run: make gen-deploy-check

      - name: Rendered artifacts are complete, valid and correctly mounted
        run: make deploy-gates

      - name: Documented novactl commands parse against the current binary
        run: make docs-cli-check

      - name: Port vocabulary is consistent (4242 / 9443 / 9555)
        run: make port-vocabulary-check

      - name: Operational images are digest-pinned
        run: make no-mutable-tags-check

      - name: CA custody — no long-running service can mount issuance authority
        run: make compose-custody-check

      - name: Every checked-in release intent validates
        run: make release-validate

      - name: The compiled-in release catalog matches the intent
        run: make catalog-check

      - name: Every documented compose combination renders the artifacts it should
        run: make compose-topology-check

      - name: UPGRADING.md's matrix matches the intent, the coverage and the policy
        run: make release-docs-check

      - name: An existing federation can cross this release using only UPGRADING.md
        run: make live-upgrade-e2e

  # ── TIER 2: rc-docker ──────────────────────────────────────────────────
  #
  # Docker-capable, no TUN. These are DRILLS: they stand real binaries up
  # against real Postgres and assert what happened, so they can support an
  # executed claim.
  #
  # Not on every push — they take tens of minutes. Promotion to a release
  # candidate requires this tier to have passed, and release.yml runs it against
  # the candidate digests rather than trusting a green run from a week ago.
  upgrade-evidence:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # the predecessor is checked out as a worktree
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: libvips headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev

      # The only evidence that can support a rollback-safe claim: the
      # PREDECESSOR coordinator run against the FORWARD schema.
      - name: schema — the predecessor against the forward schema
        run: make upgrade-schema-e2e

      # Mixed-version protocol on a fresh database.
      - name: wire — a baseline donor against the candidate coordinator
        run: make upgrade-wire-e2e

      # UPGRADING.md promises a tested restore, and composed obligations can
      # make restore the literal rollback boundary.
      - name: backup — taken AND restored
        run: make backup-restore-e2e

      # Six donors registering SIMULTANEOUSLY against the predecessor
      # coordinator, then a real schema advance and coordinator swap. On this
      # tier rather than release-tun because the overlay is transport and the
      # claim is about coordinator policy — a gate that runs in CI beats one
      # waiting on a self-hosted runner.
      - name: mixed fleet — a coordinator upgrade needs no donor upgrade
        run: make mixed-fleet-e2e

      # SKIPS until published artifacts exist, and says so. A skip is not a
      # pass: a claim proven by a skipped gate is rejected.
      - name: released artifacts — the real transition
        run: make upgrade-release-e2e

  # ── TIER 3: release-tun ────────────────────────────────────────────────
  #
  # Needs /dev/net/tun and privileged networking, which hosted runners cannot
  # reliably provide — hence the self-hosted label and the manual trigger.
  # `federation-deploy-e2e` lives on this tier. `mixed-fleet-e2e` was planned
  # for it and moved DOWN to rc-docker once it was written: the overlay is
  # transport, the claim is about coordinator policy, and a gate that runs on
  # every main push is worth more than one gated on a self-hosted runner. What
  # loopback costs is recorded in its coverage entry rather than glossed.
  #
  # Deliberately NOT wired to a schedule. A tier nobody watches that fails
  # silently is worse than one an operator runs before cutting a release.

  donor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build donor image (no push)
        run: make node-image
      - name: A generated donor bundle reports healthy
        run: NOVA_NODE_IMAGE=nova-node:dev make donor-bundle-health
      - name: Forbidden-inventory scan
        run: make node-image-inventory
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: nova-node:dev
          format: spdx-json
          output-file: nova-node.sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nova-node-sbom
          path: nova-node.sbom.spdx.json

  # Pushes the donor image BY DIGEST to GHCR and signs that digest with cosign
  # keyless/OIDC. Trusted ref only: never on pull requests (untrusted refs must
  # not mint signatures). The local-only workflow never pushes, so this is
  # exercised the first time CI runs on main.
  donor-sbom-sign:
    runs-on: ubuntu-latest
    needs: donor-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push donor image by digest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/node.Dockerfile
          push: true
          tags: ghcr.io/nova-archive/nova-node:sha-${{ github.sha }}
          build-args: |
            NOVA_VERSION=sha-${{ github.sha }}
            NOVA_REVISION=${{ github.sha }}
            NOVA_BUILD_DATE=${{ github.event.repository.updated_at }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the image digest (keyless)
        run: cosign sign --yes ghcr.io/nova-archive/nova-node@${{ steps.push.outputs.digest }}
      - name: Attest provenance to the digest
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ghcr.io/nova-archive/nova-node
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # The SBOM must describe the EXACT signed digest, not the local :dev image
      # donor-build scanned. Generate + cosign-attest it against the digest so
      # "signed image + SBOM for that digest" is actually true.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: SBOM for the pushed digest + attest
        run: |
          DIGEST_REF=ghcr.io/nova-archive/nova-node@${{ steps.push.outputs.digest }}
          syft "$DIGEST_REF" -o spdx-json=nova-node.sbom.spdx.json
          cosign attest --yes --type spdxjson \
            --predicate nova-node.sbom.spdx.json "$DIGEST_REF"

  # Go vulnerability reachability analysis. Complements the manual Dependabot
  # triage (CONTRIBUTING.md "Toolchain currency") with call-graph reachability:
  # only vulns that are actually reachable from Nova's code fail the build.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev libheif-dev libjxl-dev
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Coordinator release image: build + push BY DIGEST to GHCR, cosign keyless
  # sign, provenance + SBOM attestation. Mirrors donor-sbom-sign so the operator
  # image has the same supply-chain guarantees as the donor image. Trusted ref
  # only: never on pull requests.
  coordinator-sbom-sign:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push coordinator image by digest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/coordinator.Dockerfile
          push: true
          tags: ghcr.io/nova-archive/nova-coordinator:sha-${{ github.sha }}
          build-args: |
            NOVA_VERSION=sha-${{ github.sha }}
            NOVA_REVISION=${{ github.sha }}
            NOVA_BUILD_DATE=${{ github.event.repository.updated_at }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the image digest (keyless)
        run: cosign sign --yes ghcr.io/nova-archive/nova-coordinator@${{ steps.push.outputs.digest }}
      - name: Attest provenance to the digest
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ghcr.io/nova-archive/nova-coordinator
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: SBOM for the pushed digest + attest
        run: |
          DIGEST_REF=ghcr.io/nova-archive/nova-coordinator@${{ steps.push.outputs.digest }}
          syft "$DIGEST_REF" -o spdx-json=nova-coordinator.sbom.spdx.json
          cosign attest --yes --type spdxjson \
            --predicate nova-coordinator.sbom.spdx.json "$DIGEST_REF"

  # P2-M7 (D-M7-2): corpus-bench regression signal. Gates on asymptotic shape
  # + query plans (small corpus, generous ci-profile slack) — the full-scale
  # release gate is the LOCAL `make bench-corpus` run, never a per-push job.
  bench-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Query-plan gate
        run: make bench-corpus-explain
      - name: Corpus regression bench (small profile)
        run: make bench-corpus-ci
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
